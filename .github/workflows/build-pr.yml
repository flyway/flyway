name: Build PRs

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        java:
          - 17
        include:
          # Flyway v14 will require Java 21. Exercise that transition before
          # the bytecode baseline changes, and keep testing the current JDK.
          - os: ubuntu-latest
            java: 21
          - os: ubuntu-latest
            java: 26
      fail-fast: false

    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout Flyway
      uses: actions/checkout@v7
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'maven'
        server-id: flyway-community-db-support

    - name: Build with Maven
      run: mvn -B install -e --file pom.xml
      env:
        GITHUB_TOKEN: ${{ github.token }}
